<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1eef6;--panel:#fbfaff;--ink:#241a3a;--mute:#74698a;--line:#ddd6ea;--accent:#4b2e83;--accent-ink:#fff;--key:#fff;--keyon:#b9a2ee;--black:#241a3a;--danger:#a3324f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f24;--panel:#1d1631;--ink:#efeaff;--mute:#9a8fb5;--line:#322a4a;--accent:#b9a2ee;--accent-ink:#1a1230;--key:#e9e4f5;--keyon:#8f6fe0;--black:#0d0818;--danger:#ff8aa5}}
:root[data-theme="dark"]{--bg:#150f24;--panel:#1d1631;--ink:#efeaff;--mute:#9a8fb5;--line:#322a4a;--accent:#b9a2ee;--accent-ink:#1a1230;--key:#e9e4f5;--keyon:#8f6fe0;--black:#0d0818;--danger:#ff8aa5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 20px 64px}
h1{font:600 34px/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 24px;letter-spacing:.01em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.keys{position:relative;display:flex;height:84px;margin:0 0 22px;border-radius:0 0 10px 10px;overflow:hidden;border:1px solid var(--line)}
.wk{flex:1;background:var(--key);border-right:1px solid var(--line);transition:background .4s}
.wk.on{background:var(--keyon)}
.bk{position:absolute;top:0;width:4.2%;height:55%;background:var(--black);border-radius:0 0 4px 4px}
.time{font:500 clamp(64px,19vw,96px)/1 "Cormorant Garamond",Georgia,serif;font-variant-numeric:lining-nums tabular-nums;text-align:center;margin:6px 0 18px}
label{display:block;font-size:14px;color:var(--mute);margin:0 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}
button{font:600 16px Figtree,sans-serif;cursor:pointer;border:0;border-radius:999px;padding:14px 28px;background:var(--accent);color:var(--accent-ink);width:100%}
button.stop{background:var(--danger);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}
.stat{padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font:600 26px/1.1 "Cormorant Garamond",Georgia,serif}
.stat span{font-size:13px;color:var(--mute)}
h2{font:600 24px "Cormorant Garamond",Georgia,serif;margin:32px 0 10px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-bottom:12px}
.bar i{grid-column:1/-1;display:block;height:6px;border-radius:3px;background:var(--accent)}
.day{font-size:14px;color:var(--mute);margin:18px 0 6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item small{display:block;color:var(--mute)}
.item .d{font-weight:600;white-space:nowrap}
.del{width:auto;background:none;color:var(--mute);padding:6px 10px;font-weight:500;font-size:14px}
.empty{color:var(--mute);padding:8px 0}
@media (max-width:420px){.row{flex-direction:column;gap:0}.stats{gap:8px}.stat{padding:12px}}
</style>
</head>
<body>
<main>
<h1>Practice Log</h1>
<div class="keys" id="keys" aria-hidden="true"></div>
<section class="card">
  <div class="time" id="clock" role="timer" aria-live="off">0:00</div>
  <div class="row">
    <div><label for="act">What are you doing?</label><input id="act" value="Piano" list="acts" autocomplete="off"></div>
    <div><label for="piece">Piece or focus</label><input id="piece" placeholder="e.g. Clair de Lune" list="pieces" autocomplete="off"></div>
  </div>
  <datalist id="acts"></datalist><datalist id="pieces"></datalist>
  <button id="go">Start session</button>
</section>
<div class="stats">
  <div class="stat"><b id="sToday">0m</b><span>Today</span></div>
  <div class="stat"><b id="sWeek">0m</b><span>Last 7 days</span></div>
  <div class="stat"><b id="sAll">0m</b><span>All time</span></div>
</div>
<h2>Time by piece</h2><div id="byPiece"></div>
<h2>History</h2><div id="hist"></div>
</main>
<script>
var KEY="practice-log-v1",S={sessions:[],running:null};
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
// keyboard strip
var kb=$("keys"),blackAt=[1,2,4,5,6,8,9,11,12],N=14;
for(var i=0;i<N;i++){var k=document.createElement("div");k.className="wk";kb.appendChild(k)}
blackAt.forEach(function(p){var b=document.createElement("div");b.className="bk";b.style.left=(p/N*100-2.1)+"%";kb.appendChild(b)});
function lightKey(sec){var ks=kb.querySelectorAll(".wk");ks.forEach(function(k,i){k.classList.toggle("on",sec!==null&&i===Math.floor(sec/3)%N)})}
function clock(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
return h?h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"):m+":"+String(x).padStart(2,"0")}
function dur(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60);
if(h)return h+"h "+m+"m";if(m)return m+"m";return s+"s"}
function dayKey(t){var d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var now=Date.now(),tk=dayKey(now),wk=now-7*864e5,t=0,w=0,a=0,by={};
  S.sessions.forEach(function(s){a+=s.dur;if(dayKey(s.start)===tk)t+=s.dur;if(s.start>=wk)w+=s.dur;
    var n=s.piece||s.act;by[n]=(by[n]||0)+s.dur});
  $("sToday").textContent=dur(t);$("sWeek").textContent=dur(w);$("sAll").textContent=dur(a);
  var ent=Object.keys(by).map(function(k){return[k,by[k]]}).sort(function(x,y){return y[1]-x[1]}),max=ent.length?ent[0][1]:1;
  $("byPiece").innerHTML=ent.length?ent.map(function(e){return'<div class="bar"><span>'+esc(e[0])+'</span><b>'+dur(e[1])+'</b><i style="width:'+Math.max(3,e[1]/max*100)+'%"></i></div>'}).join(""):'<p class="empty">Nothing yet. Finish a session and it shows up here.</p>';
  var list=S.sessions.slice().sort(function(x,y){return y.start-x.start}),html="",last="";
  list.forEach(function(s){var k=dayKey(s.start);
    if(k!==last){last=k;html+='<div class="day">'+new Date(s.start).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+'</div>'}
    html+='<div class="item"><div>'+esc(s.piece||"No piece noted")+'<small>'+esc(s.act)+' at '+new Date(s.start).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})+'</small></div><div><span class="d">'+dur(s.dur)+'</span> <button class="del" data-id="'+s.id+'" aria-label="Delete session">Delete</button></div></div>'});
  $("hist").innerHTML=html||'<p class="empty">Your sessions will be listed here.</p>';
  var A={},P={};S.sessions.forEach(function(s){A[s.act]=1;if(s.piece)P[s.piece]=1});
  $("acts").innerHTML=Object.keys(A).map(function(v){return'<option value="'+esc(v)+'">'}).join("");
  $("pieces").innerHTML=Object.keys(P).map(function(v){return'<option value="'+esc(v)+'">'}).join("");
}
function tick(){
  if(!S.running){$("clock").textContent="0:00";lightKey(null);return}
  var s=Math.floor((Date.now()-S.running.start)/1000);$("clock").textContent=clock(s);lightKey(s);
}
function sync(){var r=!!S.running,b=$("go");b.textContent=r?"Stop and save":"Start session";b.className=r?"stop":"";
  $("act").disabled=r;$("piece").disabled=r;if(r){$("act").value=S.running.act;$("piece").value=S.running.piece}}
$("go").onclick=function(){
  if(!S.running){S.running={start:Date.now(),act:$("act").value.trim()||"Piano",piece:$("piece").value.trim()}}
  else{var d=Math.round((Date.now()-S.running.start)/1000);
    if(d>=1)S.sessions.push({id:String(Date.now()),act:S.running.act,piece:S.running.piece,start:S.running.start,dur:d});
    S.running=null}
  save();sync();tick();render()};
$("hist").onclick=function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-id");
  if(id&&confirm("Delete this session?")){S.sessions=S.sessions.filter(function(s){return s.id!==id});save();render()}};
sync();render();tick();setInterval(tick,1000);
</script>
</body>
</html>
